# ビルド確認と、タグ（v*）を付けたときのリリース用 ZIP の作成
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build tray app
        shell: powershell
        run: ./build.ps1

      - name: Check scripts parse
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1 | ForEach-Object {
            $errors = $null
            # UTF-8 として読む（irm | iex 用の get.ps1 は BOM なしのため、ParseFile だと文字化けする）
            $text = [IO.File]::ReadAllText($_.FullName, [Text.Encoding]::UTF8)
            [void][Management.Automation.Language.Parser]::ParseInput($text, $_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Make package
        shell: powershell
        run: |
          $pkg = 'AdGuardHomeTray'
          New-Item -ItemType Directory -Force "dist/$pkg/build" | Out-Null
          Copy-Item build/AdGuardHomeTray.exe, build/*.dll "dist/$pkg/build/"
          Copy-Item Setup.cmd, install.ps1, uninstall.ps1, build.ps1, README.md, LICENSE, AGENTS.md "dist/$pkg/"
          Copy-Item scripts, lib, src, setup -Destination "dist/$pkg/" -Recurse
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip" -Force
          # 自己更新（manage.ps1）が照合する SHA-256
          $hash = (Get-FileHash "dist/$pkg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("dist/$pkg.zip.sha256", "$hash  $pkg.zip`n")
          # インストーラーの入口（毎回最新のリリースを取得してセットアップ画面を開く）
          Copy-Item build/AdGuardHomeSetup.exe dist/

      - uses: actions/upload-artifact@v7
        with:
          name: AdGuardHomeTray
          path: |
            dist/AdGuardHomeTray.zip
            dist/AdGuardHomeTray.zip.sha256
            dist/AdGuardHomeSetup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/AdGuardHomeSetup.exe dist/AdGuardHomeTray.zip dist/AdGuardHomeTray.zip.sha256 --title "${{ github.ref_name }}" --notes-file .github/release-notes.md
